name: 🐛 Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把信息填全 —— 缺信息的 issue 通常要来回好几轮才能定位。
        提问前建议先搜一下 [已有 issue](https://github.com/CGmoke/robot-forge/issues?q=is%3Aissue)。

  - type: dropdown
    id: scope
    attributes:
      label: 涉及哪个部分
      options:
        - packages/reusable_model（Python 复用库）
        - 仓库本身（文档 / CI / 结构）
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 实际发生了什么？期望发生什么？
      placeholder: |
        期望：pytest 全部通过
        实际：test_gridmap.py 第 3 个用例抛 xxx
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 从干净环境开始的完整命令，越具体越好
      render: bash
      placeholder: |
        git clone https://github.com/CGmoke/robot-forge.git
        cd robot-forge/packages/reusable_model
        python -m pip install -e ".[test]"
        python -m pytest tests/test_gridmap.py -x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错日志 / 截图
      description: 完整堆栈或终端输出（不要只贴最后一行）
      render: shell
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      description: 执行 `python -V` 的结果
      placeholder: "3.12.3"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: 你使用的 commit / 版本
      description: 执行 `git rev-parse --short HEAD` 的结果
      placeholder: f6103a6
    validations:
      required: false
