name: python-ci

on:
  push:
    branches: [main]
    paths:
      - 'packages/reusable_model/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'packages/reusable_model/**'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: packages/reusable_model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（含可选依赖，覆盖更多分支）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,vision,hardware,yaml]"

      - name: 运行单元测试
        run: python -m pytest -q

      - name: 校验源码可导入（模拟未安装可选依赖的用户）
        run: |
          python - <<'PY'
          import reusable_model, reusable_model.geometry.rotations3d
          print("reusable_model", reusable_model.__version__, "ok")
          PY
