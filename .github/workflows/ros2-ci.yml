name: ros2-ci

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - '.github/workflows/ros2-ci.yml'
  pull_request:
    paths:
      - 'projects/**'
      - '.github/workflows/ros2-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: colcon build (Jazzy)
    runs-on: ubuntu-latest
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-rosdep

      - name: 解析 rosdep 依赖（尽力而为）
        continue-on-error: true
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep init 2>/dev/null || true
          rosdep update || true
          cd projects/tianyi25-sim/ros2_ws
          rosdep install --from-paths src --ignore-src -y -r

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd projects/tianyi25-sim/ros2_ws
          colcon build \
            --packages-select tianyi25_urdf tianyi25_sim \
            --symlink-install \
            --event-handlers console_direct+

      - name: 冒烟检查（包能被 ament 索引到）
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd projects/tianyi25-sim/ros2_ws
          source install/setup.bash
          ros2 pkg prefix tianyi25_urdf
          ros2 pkg prefix tianyi25_sim
          test -f install/tianyi25_sim/share/tianyi25_sim/worlds/greeting_world.sdf
          test -f install/tianyi25_urdf/share/tianyi25_urdf/urdf/tianyi25_urdf.urdf
