## greeting_body/config/joint_map.yaml
##
## URDF 关节名 -> 实机 ros2_bridge_msgs 电机 ID 映射 + 各关节 URDF 行程（rad）。
##
## 依据：
##   · 关节名与行程：tianyi25_urdf/urdf/tianyi25_urdf.urdf 的 <joint>/<limit>；
##   · 电机 ID 与行程：实机 /home/nvidia/xos/robot_control/config/control_sdk_config/
##     config_ty2.5.yaml 的 motor_head / motor_arms_left / motor_arms_right /
##     motor_waist_canfd / motor_waist_zeroerr —— 逐项核对，两者限位完全一致。
##
## 🔴 腿部电机 51 / 52 禁止下发，本表不包含。
## 🔴 每组电机必须整组下发（左臂 7 个 + 右臂 7 个合并为一条 /arm/cmd）。
##
## 关节 -> 电机 ID 对照（天轶 2.5）：
##   头部 1=head_roll(歪头) 2=head_pitch(抬头) 3=head_yaw(转头)
##   左臂 11=肩pitch 12=肩roll 13=肩yaw 14=肘pitch 15=肘yaw 16=腕pitch 17=腕roll
##   右臂 21=肩pitch 22=肩roll 23=肩yaw 24=肘pitch 25=肘yaw 26=腕pitch 27=腕roll
##   腰部 31=waist_yaw 32=waist_pitch

version: "1.0"

# 各组控制帧的 Header.frame_id（实机约定值）
frame_ids:
  head: head
  arm: arm
  waist: waist

# 关节分组与顺序（顺序即 ctrl 数组顺序，不可随意调换）
groups:
  head:
    - {joint: head_roll_joint,  id: 1}     # 歪头（roll）
    - {joint: head_pitch_joint, id: 2}     # 抬头/低头（pitch）
    - {joint: head_yaw_joint,   id: 3}     # 转头（yaw）
  arm:
    - {joint: shoulder_pitch_l_joint, id: 11}
    - {joint: shoulder_roll_l_joint,  id: 12}
    - {joint: shoulder_yaw_l_joint,   id: 13}
    - {joint: elbow_pitch_l_joint,    id: 14}
    - {joint: elbow_yaw_l_joint,      id: 15}
    - {joint: wrist_pitch_l_joint,    id: 16}
    - {joint: wrist_roll_l_joint,     id: 17}
    - {joint: shoulder_pitch_r_joint, id: 21}
    - {joint: shoulder_roll_r_joint,  id: 22}
    - {joint: shoulder_yaw_r_joint,   id: 23}
    - {joint: elbow_pitch_r_joint,    id: 24}
    - {joint: elbow_yaw_r_joint,      id: 25}
    - {joint: wrist_pitch_r_joint,    id: 26}
    - {joint: wrist_roll_r_joint,     id: 27}
  waist:
    - {joint: waist_yaw_joint,   id: 31}
    - {joint: waist_pitch_joint, id: 32}

# [lower, upper] rad —— 与 URDF <limit> 一致；下发时再收缩 soft_limit_margin_rad
limits:
  head_roll_joint:  [-0.453786, 0.453786]
  head_pitch_joint: [-0.436332, 0.436332]
  head_yaw_joint:   [-1.570796, 1.570796]

  waist_yaw_joint:   [-3.141593, 3.141593]
  waist_pitch_joint: [0.000000, 2.181662]

  shoulder_pitch_l_joint: [-2.967060, 2.967060]
  shoulder_roll_l_joint:  [-0.209440, 2.617994]
  shoulder_yaw_l_joint:   [-2.967060, 2.967060]
  elbow_pitch_l_joint:    [-2.617994, 0.261799]
  elbow_yaw_l_joint:      [-2.792527, 2.792527]
  wrist_pitch_l_joint:    [-0.785398, 1.047198]
  wrist_roll_l_joint:     [-1.605703, 1.605703]

  shoulder_pitch_r_joint: [-2.967060, 2.967060]
  shoulder_roll_r_joint:  [-2.617994, 0.209440]
  shoulder_yaw_r_joint:   [-2.967060, 2.967060]
  elbow_pitch_r_joint:    [-2.617994, 0.261799]
  elbow_yaw_r_joint:      [-2.792527, 2.792527]
  wrist_pitch_r_joint:    [-0.785398, 1.047198]
  wrist_roll_r_joint:     [-1.605703, 1.605703]