# 迎宾固定范围点位表 —— 实机侧 /greeting/navigate_to 服务端使用
#
# 🔴 坐标必须现场实测标定，禁止推算或沿用仿真值。
#    （tianyi25_sim/config/waypoints.yaml 是【仿真专用】，坐标对应
#      worlds/greeting_world.sdf 的家具布置，切勿混用）
# 坐标系：map（现场建图原点）
#
# 现场标定方法（建议）：
#   1) 用底盘遥控把机器人移到目标位置
#   2) curl -s http://192.168.11.10:9090/api/core/navigation/v1/pose
#      读取 x / y / yaw，回填到本文件
#   3) 重启 navigate_to_server 使新点位生效
frame_id: map

waypoints:
  standby:       {x: 0.0, y: 0.0, yaw: 0.0}   # 迎宾位（基准点，默认不移动）
  explain_point: {x: 0.0, y: 0.0, yaw: 0.0}   # 讲解位（展板/大屏前，单段 ≤10 m）
  photo_point:   {x: 0.0, y: 0.0, yaw: 0.0}   # 合影位（可选）

# 固定范围应用层软限位（坐标围栏，规划方案 §7.6「应用层 + 物理护栏」双重保障
# 中的应用层那一重）：点位超出该范围时 goal 会被直接拒绝。
range_limit:
  x: [-3.0, 3.0]
  y: [-3.0, 3.0]