version: "1.1"

segments:

  - id: 1
    name: GREETING
    steps:
      - kind: cue
        motion_name: greet_open_arms
        speed_scale: 0.5
        lead_s: 1.0
        text: "各位领导、各位来宾，各位校友企业家朋友们，大家好！欢迎莅临新乡国际会议中心雷迪森酒店。"

  - id: 2
    name: INTRO
    steps:
      - kind: cue
        motion_name: guide_pose
        speed_scale: 0.6
        lead_s: 0.0
        text: "我是本次活动智能迎宾机器人天轶，欢迎来到智汇牧野 与 “新” 同行产业合作对接暨校友企业家创新发展科创盛会。"

  - id: 3
    name: EXPLAIN
    steps:
      - kind: speak
        text: "本次大会设置两大核心活动板块。第一板块开展产业座谈、前沿科研项目路演、产业投资推介、重点项目集中签约，打通创新链与产业链双向通道；第二板块以 “旗” 聚校友力量，“科” 创产业未来为主题，举办红旗区项目对接暨校友企业家创新发展座谈会，包含企业家科创实践分享、高校科技成果转化发布、政企圆桌研讨、产学研签约、校友企业家联盟轮值主席传递等系列议程，"
      - kind: cue
        motion_name: point_side_right
        speed_scale: 0.7
        lead_s: 0.0
        text: "大会主会场位于前方金穗厅。"

  - id: 4
    name: CHECKIN
    steps:
      - kind: cue
        motion_name: point_left
        speed_scale: 0.6
        lead_s: 3.0
        text: "请各位来宾移步至签到处完成信息登记，领取会务资料与活动手册。"

  - id: 5
    name: WELCOME
    steps:
      - kind: cue
        motion_name: welcome_present
        speed_scale: 0.6
        lead_s: 3.0
        text: "本次活动聚合政府、高校科研团队、行业专家、投资机构、校友企业多方资源，以校企协同赋能产业升级，促进高校科研成果落地转化，推动校友经济与地方产业链深度融合。"

  - id: 6
    name: GUIDE
    steps:
      - kind: cue
        motion_name: guide_pose
        speed_scale: 0.6
        lead_s: 3.0
        text: "请跟随指引前往金穗厅会场共叙情谊、共探机遇、共寻合作，共筑产业新生态，预祝本次活动圆满顺利！"

  - id: 7
    name: FAREWELL
    steps:
      - kind: cue
        motion_name: gentle_bow
        speed_scale: 0.6
        lead_s: 1.0
        text: "祝各位来宾此行收获满满，感谢您的到来！"