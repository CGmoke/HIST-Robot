## 遥控器按键映射表 —— greeting_teleop/joy_mapper 使用（config/teleop_map.yaml）
##
## 作用：订阅平台遥控器事件话题 /sbus_data/event（bodyctrl_msgs/msg/SbusData），
##       把【命名按键事件】与【摇杆方向】翻译成迎宾命令，发布到
##       /greeting/panel_command（std_msgs/String）。
##       下游有两个消费者：
##         · 全流程命令 -> panel_command_bridge 的同包节点 flow_command_bridge
##                        -> /greeting/control_cmd（ConsoleCommand）-> orchestrator 讲稿
##         · 动作快捷键 -> panel_command_bridge -> /greeting/play_motion（动作 Action）
##
## 命令词表：
##   · 全流程  ： start | pause | resume | next | prev | goto:<段号> | stop | manual
##               （触发《大会流程》：动作由 orchestrator 的 cue 编排，动作比语音提前触发）
##   · 动作快捷键： motion:<动作名>
##       动作名取自 greeting_body/config/motions.yaml：
##       salute_bow / wave_official / point_right / point_left /
##       farewell_bow / photo_pose / idle_scan /
##       greet_open_arms / guide_pose / point_side_right / gentle_bow
##   一个按键也可同时发多条命令，用 ';' 连接（逐条独立发布），
##       如 "stop;motion:salute_bow"
##
## 🔴 命名键（与 bodyctrl_msgs/SbusData.KEY_* 常量一一对应，无需记数字下标）：
##    点动按键： a  a_up | b  b_up | c  c_up | d  d_up
##              （a=按下瞬间触发；a_up=松开瞬间触发，按需使用）
##    三档 E/F： e_up  e_mid  e_down | f_up  f_mid  f_down
##    左右 G/H： g_left g_mid g_right | h_left h_mid h_right
##
## 🔴 摇杆命名键（来自 SbusData.x1/y1/x2/y2，方向上升沿触发，无需订阅 Joy）：
##    x1_high  x1_low   （左摇杆 X：右/左）
##    y1_high  y1_low   （左摇杆 Y：上/下，文档定义 y1 下=-1 上=+1）
##    x2_high  x2_low   （右摇杆 X：右/左）
##    y2_high  y2_low   （右摇杆 Y：上/下）

## 🔴 标定建议：
##   ros2 launch greeting_teleop teleop.launch.py monitor:=true
##   逐个按键/拨杆/推摇杆，观察日志里的 key_event 名与"前提[...]"状态，确认无误后再正常启动。

guards:
  # —— 组1：G 拨到「左」= 分段组（第 1~4 段）——
  - key: e_up
    keys:
      a: goto:1                   # E上 + A：第 1 段 欢迎致辞 + 迎宾手势
      b: goto:2                   # E上 + B：第 2 段 自我介绍 + 轻抬引导
      c: goto:3                   # E上 + C：第 3 段 大会板块 + 右臂侧指金穗厅
      d: goto:4                   # E上 + D：第 4 段 签到指引 + 左臂抬手指向

  # —— 组2：G 拨到「右」= 分段组（第 5~7 段）——
  - key: e_down
    keys:
      a: goto:5                   # E下 + A：第 5 段 欢迎致辞 + 迎宾手势
      b: goto:6                   # E下 + B：第 6 段 引路指引 + 右臂前指
      c: goto:7                   # E下 + C：第 7 段 离场祝贺 + 轻缓致意礼
## ============================================================================
## 常驻按键 keys（不受前提限制，始终生效）—— H右=急停 stop
## ============================================================================
keys:
  h_right: stop     # H 右  ：急停回 IDLE（安全键，随时可中止流程）